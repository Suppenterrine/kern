name: KERN Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- 0) Konsistenz-Gate -------------------------------------------------
  # Nichts wird veröffentlicht, bevor das hier grün ist. Deckt ab:
  #   - Tests
  #   - Version in allen abgeleiteten Dateien identisch
  #   - dokumentierte Fehlercodes == tatsächlich ausgegebene
  #   - Release-Tag == Cargo.toml-Version
  # Ohne das könnte ein Release als v2.0.0 getaggt sein und Binaries
  # ausliefern, die sich als 1.2.0 melden. Siehe docs/PRINCIPLES.md.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          default: true

      - name: Consistency checks
        run: cargo xtask check

      - name: Release tag matches the crate version
        run: cargo xtask check-tag "${{ github.ref_name }}"

      - name: Tests
        run: cargo test

  # ---- 1) Windows-Builds (CLI & Server) per Matrix ------------------------
  build-win:
    needs: consistency
    if: contains(github.event.release.body, '[KERN]') || contains(github.event.release.body, '[SERVER]')
    runs-on: windows-latest
    strategy:
      matrix:
        bin: [kern, kern-server]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust (nightly, MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-pc-windows-msvc
          default: true

      - name: Build ${{ matrix.bin }}.exe
        run: cargo build --release --bin ${{ matrix.bin }}

      - name: Upload ${{ matrix.bin }}.exe to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/${{ matrix.bin }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- 2) Linux-Server + Docker ------------------------------------------
  build-linux:
    if: contains(github.event.release.body, '[SERVER]')
    needs: build-win
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          default: true

      - name: Build kern-server (Linux)
        run: cargo build --release --bin kern-server

      - name: Upload Linux-Binary to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/kern-server
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image to GHCR
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            --build-arg BUILD_BIN=kern-server \
            -t ghcr.io/${REPO_OWNER_LC}/kern-server:${{ github.ref_name }} \
            -t ghcr.io/${REPO_OWNER_LC}/kern-server:latest \
            .
          docker push ghcr.io/${REPO_OWNER_LC}/kern-server:${{ github.ref_name }}
          docker push ghcr.io/${REPO_OWNER_LC}/kern-server:latest
        # Note: Image is now on ghcr.io/suppenterrine/kern-server
