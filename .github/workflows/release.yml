name: Release Binary and/or Docker

on:
  release:
    types: [published]

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]  # erweiterbar
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build Kern Binary
        if: contains(github.event.release.body, '[KERN]')
        run: cargo build --release

      - name: Build Kern-Server Binary
        if: contains(github.event.release.body, '[SERVER]')
        run: cargo build --release --bin kern-server

      - name: Upload Kern Binary
        if: contains(github.event.release.body, '[KERN]')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/kern

      - name: Upload Kern-Server Binary
        if: contains(github.event.release.body, '[SERVER]')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/kern-server

  docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    if: contains(github.event.release.body, '[SERVER]')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/kern-server:${{ github.ref_name }} -f Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/kern-server:${{ github.ref_name }}
