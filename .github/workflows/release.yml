name: KERN Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- 1) Windows-Builds (CLI & Server) per Matrix ------------------------
  build-win:
    if: contains(github.event.release.body, '[KERN]') || contains(github.event.release.body, '[SERVER]')
    runs-on: windows-latest
    strategy:
      matrix:
        bin: [kern, kern-server]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust (nightly, MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-pc-windows-msvc
          default: true

      - name: Build ${{ matrix.bin }}.exe
        run: cargo build --release --bin ${{ matrix.bin }}

      - name: Upload ${{ matrix.bin }}.exe to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/${{ matrix.bin }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- 2) Linux-Server + Docker ------------------------------------------
  build-linux:
    if: contains(github.event.release.body, '[SERVER]')
    needs: build-win
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          default: true

      - name: Build kern-server (Linux)
        run: cargo build --release --bin kern-server

      - name: Upload Linux-Binary to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/kern-server
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          docker build \
            --build-arg BUILD_BIN=kern-server \
            -t ${{ secrets.DOCKER_USERNAME }}/kern-server:${{ github.ref_name }} \
            -t ${{ secrets.DOCKER_USERNAME }}/kern-server:latest \
            .
          docker push ${{ secrets.DOCKER_USERNAME }}/kern-server:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/kern-server:latest
