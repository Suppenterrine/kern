name: KERN Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

# ---------- 1) Windows-CLI-Binary ------------------------------------------
jobs:
  build-cli-win:
    if: contains(github.event.release.body, '[KERN]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly, MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-pc-windows-msvc
          default: true

      - name: Build kern.exe
        run: cargo build --release

      - name: Upload kern.exe to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/kern.exe
          token: ${{ secrets.GITHUB_TOKEN }}

# ---------- 2) Windows-Server-Binary--------- --------------------------------
  build-server-win:
    if: contains(github.event.release.body, '[SERVER]')
    runs-on: windows-latest
    needs: build-cli-win
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-pc-windows-msvc
          default: true
      - name: Build kern-server.exe (Windows)
        run: cargo build --release --bin kern-server
      - name: Upload kern-server.exe (Windows) to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/kern-server.exe
          token: ${{ secrets.GITHUB_TOKEN }}

# ---------- 3) Linux-Server-Binary + Docker --------------------------------
  build-server-linux:
    if: contains(github.event.release.body, '[SERVER]')
    needs: build-cli-win          # erst CLI, dann Server – Reihenfolge optional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Nightly wegen edition2024
      - name: Install Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          default: true

      - name: Build kern-server (Linux)
        run: cargo build --release --bin kern-server

      - name: Upload kern-server (Linux) to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/kern-server
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker (Nightly)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker image
        run: |
          docker build --build-arg BUILD_BIN=kern-server -t ${{ secrets.DOCKER_USERNAME }}/kern-server:${{ github.ref_name }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/kern-server:${{ github.ref_name }}
