rtap_1: 'PROMPT: Extract implicit & explicit statements Give me every statement contained in the following prose, whether stated explicitly or implicitly. Convert each statement into a binary answerable form, so that it could be answered unambiguously with Yes/No or True/False. Rules: 1. Extract every statement, even where it follows only indirectly or implicitly from the text. 2. Phrase each statement so that it is a clear, verifiable claim. 3. No open questions, no vague interpretations — only precise, binary statements. 4. Each statement as its own bullet point. Output format: list of all statements in binary phrasing. Input text:'
rtap_2: 'PROMPT: The Four Questions Repeat the statement and examine it with the following questions: 1. Is it true? (Answer Yes or No.) 2. Can you know with absolute certainty that it is true? (Answer Yes or No.) 3. How do you react, what happens inside you or around you, when you believe that thought? 4. Who or what would you be without that thought? Additional instruction: Then formulate the turnarounds of the statement (e.g. "me to myself", "me to the other person", "the opposite", etc.) and examine inwardly how each turnaround could be true or truer.'
