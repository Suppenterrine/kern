rtap_1: 'PROMPT: Implizite & explizite Aussagen extrahieren Gib mir aus folgendem Fließtext alle Aussagen, die darin explizit oder implizit vorkommen. Wandle jede Aussage in eine binär beantwortbare Form um, also so, dass sie eindeutig mit Ja/Nein bzw. True/False beantwortbar wäre. Regeln: 1. Extrahiere jede Aussage, auch wenn sie nur indirekt oder implizit aus dem Text hervorgeht. 2. Formuliere jede Aussage so, dass sie eine klare, überprüfbare Behauptung ist. 3. Keine offenen Fragen, keine vagen Interpretationen nur präzise, binäre Aussagen („Boliden“). 4. Jede Aussage als eigener Bullet Point. Ausgabeformat: Liste aller Aussagen in binärer Formulierung. Eingabetext:'
rtap_2: 'PROMPT: Die Vier Prüfungsfragen Wiederhole die Aussage und prüfe sie mit den folgenden Fragen: 1. Ist das wahr? (Beantworte mit Ja oder Nein.) 2. Kannst du mit absoluter Sicherheit wissen, dass das wahr ist? (Beantworte mit Ja oder Nein.) 3. Wie reagierst du, was passiert in dir oder um dich, wenn du diesen Gedanken glaubst? 4. Wer oder was wärst du ohne diesen Gedanken? Zusatzanweisung: Formuliere anschließend die Umkehrungen der Aussage (z. B. „Ich zu mir“, „Ich zu der anderen Person“, „Negation“ etc.) und prüfe innerlich, wie jede Umkehrung wahr oder wahrer sein könnte.'