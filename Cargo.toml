[package]
name = "kern"
version = "0.1.9"
edition = "2024"

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] } # <-- the missing piece
serde_yaml = "0.9"
prettytable = { version = "0.10"}
chrono = "0.4.41"
regex = "1.11.1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
