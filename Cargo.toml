[workspace]
members = ["xtask"]

[package]
name = "kern"
version = "1.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] } # <-- the missing piece
serde_yaml = "0.9"
chrono = "0.4.41"
regex = "1.11.1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
suncalc = "0.4"
term_size = "0.3"
arboard = { version = "3.4", optional = true }

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]

[dev-dependencies]
mockito = "1.7"
